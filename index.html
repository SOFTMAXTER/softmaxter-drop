<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softmaxter Drop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body, html { overflow: hidden !important; margin: 0; padding: 0; background-color: #f8fafc; }
        @media (prefers-color-scheme: dark) { body, html { background-color: #0f172a; } }
        @keyframes pulse-azure { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .status-badge { animation: pulse-azure 2s infinite; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 font-sans flex flex-col items-center p-8 relative transition-colors duration-300 h-screen">

    <header class="mb-12 text-center w-full max-w-4xl flex flex-col items-center mt-6">
        <div class="flex flex-col items-center mb-8 mt-2">
            <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-3 text-blue-600">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path></svg>
            </div>
            <div class="text-4xl font-extrabold tracking-tight leading-none text-[#1a56a6]">SOFTMAXTER</div>
            <div class="text-2xl font-bold tracking-widest uppercase mt-1 text-[#57b2da]">DROP</div>
        </div>
        <div class="flex items-center gap-2 bg-white dark:bg-slate-800 px-5 py-2 rounded-full shadow-md border border-slate-100 dark:border-slate-700">
            <span class="status-badge h-3 w-3 rounded-full bg-cyan-500 border-2 border-cyan-100"></span>
            <p id="connection-status-text" class="text-sm font-bold text-[#1a56a6] dark:text-cyan-400">Iniciando motor P2P...</p>
        </div>
    </header>

    <main class="w-full max-w-5xl flex flex-col items-center flex-grow">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-lg border border-slate-100 dark:border-slate-700 w-full mb-10 text-center">
            <p class="text-slate-500 dark:text-slate-400 text-sm font-semibold mb-2">Tu Conexión en esta red local:</p>
            <p id="my-identity" class="font-bold text-3xl text-slate-800 dark:text-slate-100">Conectando...</p>
        </div>

        <div class="flex items-center justify-between mb-8 border-b-2 border-slate-200 dark:border-slate-700 pb-4 w-full px-4">
            <h2 class="text-2xl font-bold text-slate-700 dark:text-slate-200">Dispositivos en tu red</h2>
            <div id="device-count" class="font-bold text-cyan-600 dark:text-cyan-400 bg-cyan-50 px-4 py-1.5 rounded-full text-sm">0 Dispositivos</div>
        </div>

        <div id="devices-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-8 w-full transition-opacity duration-500"></div>

        <input type="file" id="fileInput" class="hidden" multiple>
        <input type="file" id="folderInput" class="hidden" webkitdirectory multiple>
    </main>

    <div id="selection-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-40">
        <div class="bg-white dark:bg-slate-800 p-10 rounded-3xl shadow-2xl w-96 text-center">
            <h3 class="text-2xl font-bold mb-8 text-slate-800 dark:text-slate-100">¿Qué deseas enviar?</h3>
            <div class="flex gap-4 justify-center">
                <button id="btn-send-files" class="flex-1 bg-blue-50 text-blue-600 border border-blue-100 p-5 rounded-2xl hover:bg-blue-100 font-bold flex flex-col items-center gap-2">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> Archivos
                </button>
                <button id="btn-send-folder" class="flex-1 bg-sky-50 text-sky-600 border border-sky-100 p-5 rounded-2xl hover:bg-sky-100 font-bold flex flex-col items-center gap-2">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg> Carpeta
                </button>
            </div>
            <button onclick="document.getElementById('selection-modal').classList.add('hidden')" class="mt-8 text-slate-400 font-medium hover:underline">Cancelar</button>
        </div>
    </div>

    <div id="request-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-2xl w-[90%] max-w-sm text-center border border-slate-100 dark:border-slate-700">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            </div>
            <h3 class="text-xl font-bold mb-2 text-slate-800 dark:text-slate-100">Transferencia solicitada</h3>
            <p class="text-sm text-slate-500 mb-6 font-medium">Alguien quiere compartir:<br>
                <span id="request-filename" class="font-bold text-slate-700 dark:text-slate-300 block mt-2 truncate">archivo</span>
                <span id="request-filesize" class="text-xs mt-1 block font-bold text-blue-500">0 MB</span>
            </p>
            <div class="flex gap-3 justify-center">
                <button onclick="rejectTransfer()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200">RECHAZAR</button>
                <button onclick="acceptTransfer()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">ACEPTAR</button>
            </div>
        </div>
    </div>

    <div id="progress-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 p-10 rounded-3xl shadow-2xl w-[400px] text-center">
            <h3 id="progress-title" class="text-2xl font-bold mb-1 text-slate-800 dark:text-slate-100">Transfiriendo...</h3>
            <p id="progress-subtitle" class="text-sm text-slate-500 mb-8 truncate font-medium">Preparando archivos</p>
            <div class="w-full bg-slate-100 rounded-full h-5 mb-4 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-[#1a56a6] to-[#57b2da] h-5 rounded-full" style="width: 0%"></div>
            </div>
            <p id="progress-text" class="text-lg font-bold text-slate-700 dark:text-slate-200">0%</p>
        </div>
    </div>

    <script>
        // 1. REGISTRO DEL SERVICE WORKER (La magia anti-memoria-llena)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("Motor de streaming activado."));
        }

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        function formatBytes(bytes) {
            if(bytes === 0) return '0 Bytes';
            const k = 1024, dm = 2, sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        const hubUrl = "https://softmaxterrelay-brhpeugqabbpb8cj.mexicocentral-01.azurewebsites.net/transferHub?os=" + (isMobile ? "android" : "windows");
        const connection = new signalR.HubConnectionBuilder().withUrl(hubUrl).withAutomaticReconnect().build();

        let myConnectionId = "", peerConnection, dataChannel, targetDevice = null;
        let pendingCandidates = [], pendingFileToSend = null, streamPort = null;
        let incomingMetadata = null, receivedSize = 0, lastPaintTime = 0;
        let devicesOS = {};

        function updateDeviceGrid(users) {
            const grid = document.getElementById('devices-grid'); grid.innerHTML = ''; 
            document.getElementById('device-count').innerText = `${Object.keys(users).length - 1} Dispositivos`;
            
            for (const [id, dataStr] of Object.entries(users)) {
                let name = dataStr, os = "unknown";
                try { const d = JSON.parse(dataStr); name = d.name; os = d.os; } catch(e){}
                devicesOS[id] = os;

                if (id === myConnectionId) { document.getElementById('my-identity').innerText = `${name} (Yo)`; continue; }
                
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-lg border border-slate-100 flex flex-col items-center cursor-pointer hover:border-blue-400 transition-all";
                card.innerHTML = `<div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-6 text-slate-400"><svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg></div><h3 class="font-bold">${name}</h3>`;
                card.onclick = () => { 
                    targetDevice = id; 
                    document.getElementById('btn-send-folder').style.display = (isMobile || os === 'android' || os === 'ios') ? 'none' : 'flex';
                    document.getElementById('selection-modal').classList.remove('hidden'); 
                };
                grid.appendChild(card);
            }
        }

        document.getElementById('btn-send-files').onclick = () => { document.getElementById('selection-modal').classList.add('hidden'); document.getElementById('fileInput').click(); };
        document.getElementById('btn-send-folder').onclick = () => { document.getElementById('selection-modal').classList.add('hidden'); document.getElementById('folderInput').click(); };

        function showProgress(t, s) { document.getElementById('progress-modal').classList.remove('hidden'); document.getElementById('progress-title').innerText = t; document.getElementById('progress-subtitle').innerText = s; updateProgress(0); }
        function updateProgress(p) { document.getElementById('progress-bar').style.width = `${Math.round(p)}%`; document.getElementById('progress-text').innerText = `${Math.round(p)}%`; }
        function hideProgress() { document.getElementById('progress-modal').classList.add('hidden'); }

        window.acceptTransfer = function() {
            document.getElementById('request-modal').classList.add('hidden');
            showProgress("Recibiendo...", incomingMetadata.name);
            receivedSize = 0;

            // LA MAGIA DEL SERVICE WORKER: Creamos el tubo hacia el disco duro
            if (navigator.serviceWorker.controller) {
                const downloadUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/') + '__download/' + encodeURIComponent(incomingMetadata.name);
                const channel = new MessageChannel();
                streamPort = channel.port1;

                navigator.serviceWorker.controller.postMessage({
                    type: 'INIT_DOWNLOAD', url: downloadUrl, metadata: incomingMetadata
                }, [channel.port2]);

                streamPort.onmessage = (e) => {
                    if (e.data === 'READY') {
                        // Disparamos la descarga nativa (incluso en Huawei)
                        const a = document.createElement('a'); a.href = downloadUrl; a.style.display = 'none';
                        document.body.appendChild(a); a.click();
                        dataChannel.send(JSON.stringify({ type: 'response', accepted: true }));
                    } else if (e.data === 'DONE') {
                        document.getElementById('progress-title').innerText = "Transferencia Exitosa";
                        setTimeout(hideProgress, 2000); streamPort = null; incomingMetadata = null;
                    }
                };
            } else {
                // Fallback por si acaso
                dataChannel.send(JSON.stringify({ type: 'response', accepted: true }));
            }
        }

        window.rejectTransfer = function() { document.getElementById('request-modal').classList.add('hidden'); dataChannel.send(JSON.stringify({ type: 'response', accepted: false })); setTimeout(() => dataChannel.close(), 500); }

        async function sendFile(file) {
            try {
                const chunkSize = 16384; let offset = 0; let chunksSent = 0;
                while (offset < file.size) {
                    if (dataChannel.readyState !== 'open') throw new Error("Conexión perdida.");
                    while (dataChannel.bufferedAmount > 262144) { await new Promise(r => setTimeout(r, 15)); }
                    const slice = file.slice(offset, offset + chunkSize);
                    dataChannel.send(await slice.arrayBuffer());
                    offset += chunkSize; chunksSent++;
                    if (chunksSent % 30 === 0) { updateProgress((offset / file.size) * 100); await new Promise(r => setTimeout(r, 5)); }
                }
                while (dataChannel.bufferedAmount > 0) await new Promise(r => setTimeout(r, 50));
                dataChannel.send(JSON.stringify({ type: 'eof' }));
                document.getElementById('progress-title').innerText = "¡Enviado!"; setTimeout(hideProgress, 2000);
            } catch (error) { document.getElementById('progress-title').innerText = "Transferencia fallida"; setTimeout(hideProgress, 4000); }
        }

        function setupDataChannel(channel) {
            channel.binaryType = "arraybuffer";
            channel.onmessage = async (event) => {
                if (typeof event.data === 'string') {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'request') {
                        incomingMetadata = msg;
                        document.getElementById('request-filename').innerText = msg.name;
                        document.getElementById('request-filesize').innerText = formatBytes(msg.size);
                        document.getElementById('request-modal').classList.remove('hidden');
                    } else if (msg.type === 'response') {
                        if (msg.accepted) { showProgress("Enviando...", pendingFileToSend.name); sendFile(pendingFileToSend); pendingFileToSend = null; } 
                        else { hideProgress(); dataChannel.close(); }
                    } else if (msg.type === 'eof') {
                        if (streamPort) streamPort.postMessage('EOF');
                    }
                } else {
                    // INYECTAR DIRECTO AL DISCO DURO
                    if (streamPort) streamPort.postMessage(event.data);
                    receivedSize += event.data.byteLength;
                    let now = Date.now();
                    if (now - lastPaintTime > 150) {
                        lastPaintTime = now; updateProgress((receivedSize / incomingMetadata.size) * 100);
                    }
                }
            };
            channel.onclose = hideProgress;
        }

        async function setupWebRTC() {
            if (peerConnection) peerConnection.close(); pendingCandidates = [];
            peerConnection = new RTCPeerConnection({ 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] });
            peerConnection.onicecandidate = e => { if (e.candidate) connection.invoke("SendSignal", targetDevice, JSON.stringify({ ice: e.candidate })); };
            peerConnection.ondatachannel = e => { dataChannel = e.channel; setupDataChannel(dataChannel); };
        }

        connection.on("ReceiveSignal", async (senderId, message) => {
            const signal = JSON.parse(message); targetDevice = senderId;
            if (signal.sdp) {
                if (signal.sdp.type === 'offer') {
                    await setupWebRTC(); await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                    while(pendingCandidates.length > 0) await peerConnection.addIceCandidate(pendingCandidates.shift());
                    await peerConnection.setLocalDescription(await peerConnection.createAnswer());
                    connection.invoke("SendSignal", senderId, JSON.stringify({ sdp: peerConnection.localDescription }));
                } else if (signal.sdp.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                    while(pendingCandidates.length > 0) await peerConnection.addIceCandidate(pendingCandidates.shift());
                }
            } else if (signal.ice) { 
                if (peerConnection?.remoteDescription) await peerConnection.addIceCandidate(new RTCIceCandidate(signal.ice)); 
                else pendingCandidates.push(new RTCIceCandidate(signal.ice));
            }
        });

        async function handleFilesSelect(e) {
            const files = Array.from(e.target.files); if (files.length === 0) return;
            if (files.length === 1 && !files[0].webkitRelativePath) pendingFileToSend = files[0];
            else {
                showProgress("Empaquetando...", "ZIP"); const zip = new JSZip(); files.forEach(f => zip.file(f.webkitRelativePath || f.name, f));
                pendingFileToSend = new File([await zip.generateAsync({ type: "blob" })], "Archivos.zip", { type: "application/zip" });
            }
            showProgress("Conectando...", "Túnel"); await setupWebRTC();
            dataChannel = peerConnection.createDataChannel("fileTransfer"); setupDataChannel(dataChannel);
            await peerConnection.setLocalDescription(await peerConnection.createOffer());
            connection.invoke("SendSignal", targetDevice, JSON.stringify({ sdp: peerConnection.localDescription }));
            dataChannel.addEventListener('open', async () => {
                showProgress("Esperando...", "Aceptación"); await new Promise(r => setTimeout(r, 1000));
                dataChannel.send(JSON.stringify({ type: 'request', name: pendingFileToSend.name, size: pendingFileToSend.size }));
            });
            document.getElementById('fileInput').value = ""; document.getElementById('folderInput').value = "";
        }
        document.getElementById('fileInput').addEventListener('change', handleFilesSelect); document.getElementById('folderInput').addEventListener('change', handleFilesSelect);

        let currentUsers = {};
        connection.on("UpdateUserList", users => { 
            currentUsers = users; 
            if (myConnectionId) updateDeviceGrid(currentUsers); 
        });
        
        async function start() { 
            try { 
                await connection.start(); 
                myConnectionId = connection.connectionId; 
                document.getElementById('connection-status-text').innerText = "Conectado a la Red"; 
                updateDeviceGrid(currentUsers); // Refrescamos la interfaz al instante
            } 
            catch (err) { 
                console.error("Fallo la conexión:", err);
                // Si Azure nos rechaza, ahora lo veremos escrito en la pantalla
                document.getElementById('connection-status-text').innerText = "Bloqueado por Servidor (Revisa F12)"; 
                setTimeout(start, 5000); 
            } 
        }
        start();
    </script>
</body>
</html>
